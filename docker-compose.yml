version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustfundx-db
    restart: always
    environment:
      POSTGRES_DB: trustfundx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustfundx"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trustfundx-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/trustfundx
      JWT_SECRET: super-secret-jwt-key-trustfundx-2026-prod
      JWT_REFRESH_SECRET: super-secret-refresh-key-trustfundx-2026-prod
      ALGORAND_NETWORK: testnet
      ALGORAND_ALGOD_SERVER: https://testnet-api.algonode.cloud
      ALGORAND_INDEXER_SERVER: https://testnet-idx.algonode.cloud
      X402_SECRET_KEY: trustfundx-x402-hmac-secret-key-prod
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: trustfundx-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_ALGORAND_NETWORK: testnet

volumes:
  postgres_data:
